name: Render availability ping

on:
  schedule:
    # هر ۱۰ دقیقه یک بار پینگ می‌زند
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl --fail --silent --show-error --output /dev/null --retry 2 --max-time 60 https://virastar-thesis-bot.onrender.com/health
