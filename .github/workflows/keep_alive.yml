name: Render readiness monitor

on:
  schedule:
    # Every five minutes, away from the busiest start-of-hour slot.
    # GitHub may delay/drop scheduled runs; this is not an always-on guarantee.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/keep_alive.yml']

permissions:
  contents: read

concurrency:
  group: render-readiness-monitor
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake service and verify fresh Bale polling
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = "https://virastar-thesis-bot.onrender.com/ready"
          for attempt in range(1, 7):
              try:
                  request = Request(url, headers={"User-Agent": "Virastar-Readiness-Monitor/1.0"})
                  with urlopen(request, timeout=20) as response:
                      payload = response.read(65537)
                      if response.status != 200 or len(payload) > 65536:
                          raise ValueError("Unexpected readiness response")
                      data = json.loads(payload)
                  if (data.get("service") == "virastar-bale-bot"
                          and data.get("ready") is True
                          and data.get("bot_status", {}).get("started") is True):
                      print("Service ready; recent successful Bale polling confirmed.")
                      break
                  print(f"Attempt {attempt}/6: bot is not ready yet.")
              except HTTPError as error:
                  print(f"Attempt {attempt}/6: HTTP {error.code}.")
              except (URLError, TimeoutError, OSError, ValueError, AttributeError):
                  # Never publish a response body, user content or credentials.
                  print(f"Attempt {attempt}/6: readiness not confirmed.")
              if attempt < 6:
                  time.sleep(8)
          else:
              raise SystemExit("Readiness failed after bounded cold-start retries.")
          PY
